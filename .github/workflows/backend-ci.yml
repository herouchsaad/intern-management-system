name: Backend CI
on:
  push:
    branches:
      - main
    paths:
      - 'intern-management-system-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'intern-management-system-backend/**'
      - '.github/workflows/backend-ci.yml'
jobs:
  build:
    name: Type-check & Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: intern-management-system-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: intern-management-system-backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/intern-management-system-backend:latest .
      - name: Push Docker image
        if: github.event_name == 'push'
        run: docker push ghcr.io/${{ github.repository_owner }}/intern-management-system-backend:latest