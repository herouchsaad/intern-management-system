# ═══════════════════════════════════════════════════════════════════════════════
# docker-compose.yml — Intern Management System
# Lance 3 services : db (PostgreSQL) + backend (Node.js) + frontend (React/Nginx)
# Utilisation : docker compose up -d (images pulled from ghcr.io, no local build)
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────────────────────────────────────────
  # SERVICE 1 : Base de données PostgreSQL
  # ─────────────────────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: ims_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./intern-management-system-backend/ims-tables.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - ims_network

    :healthcheck
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────────────────
  # SERVICE 2 : Backend Node.js / Express
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/herouchsaad/intern-management-system-backend:latest
    container_name: ims_backend
    restart: unless-stopped

    environment:
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      GOOGLE_CALENDAR_API_KEY: ${GOOGLE_CALENDAR_API_KEY}
      NODE_ENV: production

    ports:
      - "5000:5000"

    volumes:
      - ./intern-management-system-backend/src/uploads:/app/dist/src/uploads

    networks:
      - ims_network

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 40s

  # ─────────────────────────────────────────────────────────────────────────────
  # SERVICE 3 : Frontend React (servi par Nginx)
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    image: ghcr.io/herouchsaad/intern-management-system-frontend:latest
    container_name: ims_frontend
    restart: unless-stopped

    ports:
      - "8080:80"

    networks:
      - ims_network

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# ═══════════════════════════════════════════════════════════════════════════════
# VOLUMES — Données persistantes entre les redémarrages
# ═══════════════════════════════════════════════════════════════════════════════
volumes:
  postgres_data:
    name: ims_postgres_data
    driver: local

# ═══════════════════════════════════════════════════════════════════════════════
# RÉSEAU — Réseau interne isolé pour la communication entre services
# ═══════════════════════════════════════════════════════════════════════════════
networks:
  ims_network:
    name: ims_network
    driver: bridge